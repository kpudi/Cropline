<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in — Cropline</title>
<link rel="stylesheet" href="/src/shop/shop.css">
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <span class="mark">Cropline</span>
    <h1>Log in to your account</h1>
    <form id="loginForm">
      <label class="f"><span>Email</span><input class="inp" type="email" name="email" required autofocus></label>
      <label class="f"><span>Password</span><input class="inp" type="password" name="pw" required></label>
      <button class="btn pri block" type="submit">Log in</button>
      <div class="err" id="err" hidden></div>
      <button class="btn block" id="resendBtn" type="button" hidden style="margin-top:10px">Resend confirmation email</button>
    </form>
    <div class="auth-switch">New here? <a href="/shop/signup.html">Create an account</a></div>
  </div>
</div>
<script type="module" src="/src/shop/login-page.js"></script>
